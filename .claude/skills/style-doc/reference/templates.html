<!-- ===== EMAIL (doc_type: email) — table-based, inline styles, 600px ===== -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:#F7F9FC;font-family:'Helvetica Neue',Arial,sans-serif;color:#1A1A1A;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F7F9FC;">
    <tr><td align="center" style="padding:24px 12px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0"
             style="max-width:600px;width:100%;background:#ffffff;border:1px solid #E5E7EB;border-radius:8px;overflow:hidden;">
        <tr><td style="height:6px;background:#1F3A5F;background:linear-gradient(90deg,#1F3A5F,#3E7CB1);font-size:0;line-height:0;">&nbsp;</td></tr>
        <tr><td style="padding:28px 32px 8px 32px;">
          <img src="data:image/png;base64,{{LOGO_B64}}" alt="{{AGENCY_NAME}}" height="32" style="display:block;border:0;">
        </td></tr>
        <tr><td style="padding:8px 32px 28px 32px;font-size:15px;line-height:1.6;color:#1A1A1A;">
          {{BODY_HTML}}
        </td></tr>
        <tr><td style="padding:16px 32px;border-top:1px solid #E5E7EB;font-size:12px;color:#6B7280;">
          {{AGENCY_NAME}} · {{AGENCY_EMAIL}} · {{AGENCY_WEB}}
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
<!--
  Email rules: NO flexbox/grid, NO <style> dependence for layout (many clients strip it),
  inline every style, keep width <= 600px. {{BODY_HTML}} = the message paragraphs as
  <p style="margin:0 0 14px;"> ... </p>. Render to PDF only if the caller wants an email-as-PDF.
-->
